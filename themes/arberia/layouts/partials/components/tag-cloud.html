{{/* TAG Cloud */}}
<div class="sidebar-module sidebar-module-inset border">
    <p class="h4"><a class="link-unstyled" href="/tags">{{ i18n "tagTopics" }}</a></p>
    <div id="theme-tagcloud" style="margin-bottom: 10px;">
        {{ $tags := $.Site.Taxonomies.tags.ByCount }}
        {{ $v1 := where $tags "Term" "not in" (slice "tags" "rss") }}
        {{ range $v1 }}
        {{ if .Term }}
        {{ $tagURL := printf "tags/%s" .Term | relURL }}
        <a href="{{ $tagURL }}" class="badge badge-light text-muted" role="button"
            style="text-transform: lowercase; padding-right: 5px; padding-left: 5px; margin: 2px;">{{ .Term }}
            <small>({{ .Count }})</small></a>
        {{ end }}
        {{ end }}
    </div>
</div>
