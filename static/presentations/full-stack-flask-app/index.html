## Persistence and ORM

---

### ORM

- Object-Relational Mapping
- Map Python classes to database tables
- Automatically handle database connections and transactions
- Provide a query interface for database operations

---

### How to avoid writing raw SQL?

---


### Use SQLAlchemy

- SQLAlchemy is the most popular ORM for Flask
- Provides a query interface for database operations
- Supports relationships between models, validations and constraints

---

```python
# models.py
from app import db

class User(db.Model):
    id = db.Column(db.Integer, primary_key=True)
    username = db.Column(db.String(64), unique=True, nullable=False)
    email = db.Column(db.String(120), unique=True, nullable=False)
    password_hash = db.Column(db.String(128))
    posts = db.relationship('Post', backref='author', lazy='dynamic')

class Post(db.Model):
    id = db.Column(db.Integer, primary_key=True)
    user_id = db.Column(db.Integer, db.ForeignKey('user.id'), nullable=False)
    title = db.Column(db.String(100), nullable=False)
    content = db.Column(db.Text, nullable=False)
```

---

Key Features:
- Powerful joins and filtering
- Aggregations and grouping
- Eager loading for performance
- Complex subqueries
- Bulk operations
- Window functions

---

### SQLAlchemy vs Raw SQL 🔄

<div class="fragment fade-up">
    <h4>Finding Users and Post Count 📊</h4>
    <pre style="font-size: 0.4em; width: 100%;"><code class="python" data-trim>
# SQLAlchemy (the cool way 😎)
result = (db.session.query(
    User.username,
    func.count(Post.id).label('posts'))
    .join(Post)
    .group_by(User.username)
    .all())
    </code></pre>

#### SQL (the old-school way 👴)
<pre style="font-size: 0.4em; width: 100%;"><code class="sql" data-trim>
SELECT users.username, COUNT(posts.id) as posts
FROM users
JOIN posts ON users.id = posts.user_id
GROUP BY users.username;
</code></pre>
</div>

---

<div class="fragment fade-up">
    <h4>Finding Trending Posts 🔥</h4>
    <pre style="font-size: 0.4em; width: 100%;"><code class="python" data-trim>
# SQLAlchemy (making it rain! 💫)
trending = (Post.query
    .filter(Post.created_at >= week_ago)
    .order_by(Post.views.desc())
    .limit(10)
    .all())
</code></pre>

<pre style="font-size: 0.4em; width: 100%;"><code class="sql" data-trim>
-- SQL (the classic approach 📜)
SELECT * FROM posts
WHERE created_at >= DATE_SUB(NOW(), INTERVAL 1 WEEK)
ORDER BY views DESC
LIMIT 10;
</code></pre>
</div>

<div class="fragment fade-up">
    <h4>Complex Nested Conditions 🧩</h4>
    <pre style="font-size: 0.4em; width: 100%;"><code class="python" data-trim>
# SQLAlchemy (flexing those Python muscles 💪)
posts = (Post.query
    .join(User)
    .filter(
        or_(
            and_(Post.is_published == True,
                 User.is_verified == True),
            User.is_admin == True
        ))
    .all())
</code></pre>

<pre style="font-size: 0.4em; width: 100%;"><code class="sql" data-trim>
-- SQL (when you want to feel nostalgic 🎬)
SELECT posts.* FROM posts
JOIN users ON users.id = posts.user_id
WHERE (posts.is_published = TRUE AND users.is_verified = TRUE)
   OR users.is_admin = TRUE;
</code></pre>
</div>

## Concurrency 🔄

---

### Python's Async Features 🎭

- Introduced in Python 3.5 with async/await syntax (finally! 🎉) <!-- .element: class="fragment" -->
- Coroutines: Functions that can pause and resume execution (like a yoga master! 🧘‍♂️) <!-- .element: class="fragment" -->
- Event Loop: Manages multiple coroutines concurrently (like a juggler! 🤹‍♂️) <!-- .element: class="fragment" -->
- Great for I/O-bound tasks (network, file operations) 🚀 <!-- .element: class="fragment" -->
- Not helpful for CPU-bound tasks (use multiprocessing) 🤖 <!-- .element: class="fragment" -->

---

### Async Magic in Python ✨

<div class="fragment fade-up">
    <h4>A Simple Async Example 🎭</h4>
    <pre style="font-size: 0.4em; width: 100%;"><code class="python" data-trim>
# Let's fetch some data asynchronously! 🚀
async def fetch_data():
    print("Starting the journey... 🏃‍♂️")
    await asyncio.sleep(2)  # Pretending to do some heavy lifting 🏋️‍♂️
    print("Mission accomplished! 🎯")
    return {"data": "here"}

async def main():
    # Launch 3 tasks at once (like a juggler! 🤹‍♂️)
    tasks = [fetch_data() for _ in range(3)]
    results = await asyncio.gather(*tasks)
    print("All done! 🎉")

# Takes ~2s instead of 6s (Speed demon! 🏎️)
asyncio.run(main())</code></pre>
</div>

---

## Deploying Flask Applications

---

### The Deployment Stack

- Nginx: Reverse proxy, static files, SSL termination <!-- .element: class="fragment" -->
- Gunicorn: Production-grade WSGI server <!-- .element: class="fragment" -->
- Docker: Containerization and environment consistency <!-- .element: class="fragment" -->

---

### Best Practices for Production

- Use environment variables for configuration <!-- .element: class="fragment" -->
- Separate development and production settings <!-- .element: class="fragment" -->
- Handle static files with Nginx, not Flask <!-- .element: class="fragment" -->
- Configure proper logging and monitoring <!-- .element: class="fragment" -->
- Set up health checks <!-- .element: class="fragment" -->

---

### Dockerfile Tips

```dockerfile
FROM python:3.11-slim

# Keep layers minimal and clean
RUN apt-get update && apt-get install -y \
    build-essential python3-dev \
    && rm -rf /var/lib/apt/lists/*

# Use multi-stage builds for frontend
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

# Add healthcheck
HEALTHCHECK CMD curl --fail http://localhost:8080/health
```

---

### Gunicorn Configuration

- Worker Types: sync, gevent, eventlet (choose your poison) <!-- .element: class="fragment" -->
- Worker Count: (2 x CPU cores) + 1 <!-- .element: class="fragment" -->
- Timeouts: Request timeout, graceful shutdown <!-- .element: class="fragment" -->
- Logging: Error logs, access logs <!-- .element: class="fragment" -->

```python
# gunicorn-conf.py
import multiprocessing
workers = multiprocessing.cpu_count() * 2 + 1
loglevel = "info"
capture_output = True
```

---

### Nginx as Reverse Proxy

- Handles SSL/TLS termination <!-- .element: class="fragment" -->
- Serves static files efficiently <!-- .element: class="fragment" -->
- Load balancing between workers <!-- .element: class="fragment" -->
- Buffers slow clients <!-- .element: class="fragment" -->

    <li class="fragment">Health checks and metrics - create a simple health check endpoint in your flask app.</li>
	<li class="fragment">Can use more sophisticated tools like Prometheus, Grafana, etc later on.</li>
</ul>

### SQLAlchemy vs Raw SQL

<pre style="font-size: 0.4em; width: 100%;"><code class="python" data-trim>
# Find users and their post count
# SQLAlchemy
result = (db.session.query(
    User.username,
    func.count(Post.id).label('posts'))
    .join(Post)
    .group_by(User.username)
    .all())

# SQL equivalent
"""
SELECT users.username, COUNT(posts.id) as posts
FROM users
JOIN posts ON users.id = posts.user_id
GROUP BY users.username;
"""
</pre>

---

<pre style="font-size: 0.4em; width: 100%;"><code class="python" data-trim>

# Find trending posts (most views this week)
# SQLAlchemy
trending = (Post.query
    .filter(Post.created_at >= week_ago)
    .order_by(Post.views.desc())
    .limit(10)
    .all())

# SQL equivalent
"""
SELECT * FROM posts
WHERE created_at >= DATE_SUB(NOW(), INTERVAL 1 WEEK)
ORDER BY views DESC
LIMIT 10;
"""
</pre>

<pre style="font-size: 0.4em; width: 100%;"><code class="python" data-trim>
# Complex nested conditions
# SQLAlchemy
posts = (Post.query
    .join(User)
    .filter(
        or_(
            and_(Post.is_published == True,
                 User.is_verified == True),
            User.is_admin == True
        ))
    .all())

# SQL equivalent
"""
SELECT posts.* FROM posts
JOIN users ON users.id = posts.user_id
WHERE (posts.is_published = TRUE AND users.is_verified = TRUE)
   OR users.is_admin = TRUE;
"""
