{{ define "main" }}
  <section class="shell page-header">
    <p class="eyebrow">{{ .Type | humanize }}</p>
    <h1>{{ .Title | markdownify }}</h1>
    {{ with .Content }}<div class="page-copy">{{ . }}</div>{{ end }}
  </section>
  <section class="shell post-grid">
    {{ range .Paginator.Pages }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </section>
{{ end }}
