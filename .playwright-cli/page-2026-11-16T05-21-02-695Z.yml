          - paragraph [ref=e89]:
            - text: And for the longest time, I’ve been watching DGX Spark videos non-stop but never quite pulled the trigger on the purchase. Finally, on a pleasant day when I felt brave and adventurous, I gave in and ordered 2 of these beauties via naddod.com’s
            - link "listing" [ref=e90] [cursor=pointer]:
              - /url: https://www.naddod.com/products/103030.html
            - text: (I was lucky enough to snag these just a week or two before the prices went up).
          - region "Photos of the DGX Spark delivery" [ref=e91]:
            - generic [ref=e92]:
              - figure [ref=e93]:
                - link "The sealed DGX Spark box on my desk" [ref=e94] [cursor=pointer]:
                  - /url: /dgx-spark/unboxing/DGX_Spark_box.jpg
                  - img "The sealed DGX Spark box on my desk" [ref=e95]
              - figure [ref=e96]:
                - link "Open box revealing two DGX Spark units" [ref=e97] [cursor=pointer]:
                  - /url: /dgx-spark/unboxing/IMG_1017.jpg
                  - img "Open box revealing two DGX Spark units" [ref=e98]
          - emphasis [ref=e100]: Clicked a few photos after delivery
          - paragraph [ref=e101]: "It is a great device and fits the bill in every way that matters to me:"
          - list [ref=e102]:
            - listitem [ref=e103]:
              - strong [ref=e104]: Private by default.
              - text: Credit card bills, personal photos, anything with my name on it — it all stays on the machine. No logs on someone else’s server, no terms-of-service roulette, no “your data may be used to improve our models.”
            - listitem [ref=e105]:
              - strong [ref=e106]: Multimodal, not just text.
              - text: The same hardware that holds a big language model also runs image generation entirely locally — which is how this whole post started — and it keeps getting better across audio, video, and whatever ships next.
            - listitem [ref=e107]:
              - strong [ref=e108]: Always on, always mine.
              - text: No usage caps, no rate limits, no “model retired, please migrate.”
          - figure [ref=e109]:
            - link "Gollum cradling a DGX Spark and calling it his precious" [ref=e110] [cursor=pointer]:
              - /url: /dgx-spark/gollum-dgx-spark.jpg
              - img "Gollum cradling a DGX Spark and calling it his precious" [ref=e111]
          - heading "The joy of owning intelligence" [level=2] [ref=e112]
          - paragraph [ref=e113]: "After setting these up and making sure the devices were working, the first thing I wanted to try out was image generation. With the help of Codex, I downloaded and installed the following image generation models: Qwen-Image-2.1-Turbo, FLUX.2 Klein 4B, and Z-Image-Turbo. I ran a bunch of tests, and when the images finally came out, it blew my mind. Quite thrilling to own intelligence running on your own private device and have fun with it."
          - paragraph [ref=e114]: Being a heavy Codex user for the past couple of months, I wanted to visualize Codex’s impression of my working style so far.
          - heading "Enter ComfyUI" [level=3] [ref=e115]
          - paragraph [ref=e116]:
            - text: Codex first wrote up a rough outline of its impression of my work. Then, with the help of ComfyUI, it generated the images from that outline. The first result was
            - emphasis [ref=e117]: Ajay in images
            - text: ": a cover and twelve scenes. It opens with this:"
          - blockquote [ref=e118]:
            - paragraph [ref=e119]: You build systems, test what they do, protect work that is live, and still make room for wonder.
          - paragraph [ref=e120]: A generous description. I’ll take it.
          - generic [ref=e121]:
            - figure "The Systems Gardener · Qwen You build tools and care for them after they start to run." [ref=e122]:
              - link "A maker tends an illuminated garden of small connected systems" [ref=e123] [cursor=pointer]:
                - /url: /dgx-spark/portrait-of-ajay/01-systems-gardener.png
                - img "A maker tends an illuminated garden of small connected systems" [ref=e124]
              - generic [ref=e125]:
                - strong [ref=e126]: The Systems Gardener
                - text: · Qwen
                - text: You build tools and care for them after they start to run.
            - figure "The Precise Repair · FLUX You fix the part that failed and keep the rest safe." [ref=e127]:
              - link "A gloved hand repairs one small part of a working machine" [ref=e128] [cursor=pointer]:
                - /url: /dgx-spark/portrait-of-ajay/09-precise-repair.png
                - img "A gloved hand repairs one small part of a working machine" [ref=e129]
              - generic [ref=e130]:
                - strong [ref=e131]: The Precise Repair
                - text: · FLUX
                - text: You fix the part that failed and keep the rest safe.
          - paragraph [ref=e132]: "These two capture things I care about: maintaining what you build, and fixing a failure without disturbing everything around it."
          - paragraph [ref=e133]:
            - strong [ref=e134]:
              - 'link "See the complete gallery: Ajay in images →" [ref=e135] [cursor=pointer]':
