        - generic [ref=e58]:
          - heading "The good old days" [level=2] [ref=e59]
          - paragraph [ref=e60]:
            - text: Who remembers the good old days when
            - link "I can has cheeseburger" [ref=e61] [cursor=pointer]:
              - /url: https://en.wikipedia.org/wiki/I_Can_Has_Cheezburger%3F
            - text: "was all rage? I spent so many of my waking hours going through all the funny memes the internet had to offer. The world has changed so much since then — now you can generate your own images of cats, cities, and whatever one can imagine, just by describing it to a machine. And we are spoiled for choice: head to"
            - link "openrouter.ai" [ref=e62] [cursor=pointer]:
              - /url: https://openrouter.ai
            - text: or any other service provider, try new models pay-per-usage, and pick from plenty of image and video tools on tap, including
            - link "gpt-image" [ref=e63] [cursor=pointer]:
              - /url: https://openai.com/index/introducing-4o-image-generation/
            - text: ","
            - link "Google Nano Banana" [ref=e64] [cursor=pointer]:
              - /url: https://developers.googleblog.com/introducing-gemini-2-5-flash-image
            - text: and much, much more.
          - heading "The dark side of public inference" [level=2] [ref=e65]
          - paragraph [ref=e66]:
            - text: "However, the main problem with all of these services is that any data you send to them is no longer private, in spite of whatever assurances they give. Take what happened at Cloudflare recently:"
            - link "a bug in the KV cache on their Workers AI stack leaked data across user sessions" [ref=e67] [cursor=pointer]:
              - /url: https://blog.cloudflare.com/kv-cache-exposure-remediation
              - strong [ref=e68]: a bug in the KV cache on their Workers AI stack leaked data across user sessions
            - text: — 155 responses containing pieces of other customers’ sessions, over a couple of weeks in late August and early September, and no sophisticated hacker involved, just an engineering mistake! Imagine uploading your financial statements to a hosted model and a stranger’s session getting served your private financial details.
          - paragraph [ref=e69]:
            - text: Or take the
            - link "Cursor incident" [ref=e70] [cursor=pointer]:
              - /url: https://cursor.com/blog/security-incident-update
            - text: from October 2026 — an attacker got into a bucket of coding agent traces through an access key leaked by its inference vendor, stole credentials from it, and from there pushed a trojanized Claude Code extension into Cursor’s VS Code marketplace for about 11 hours, reaching at most 5,000 users. Prompts, support data, and customer details were all in the mix.
          - paragraph [ref=e71]:
            - text: And it isn’t just the hosted services either — it’s also what AI-generated apps ship with.
            - link "Crissy Field analyzed 159,041 Lovable projects" [ref=e72] [cursor=pointer]:
              - /url: https://www.crissyfield.de/research/lovable-en/
            - text: and found 24,664 sending database records to the browser with no login required; 30% of those they inspected had tables full of email addresses. Some exposed passport numbers and payment details, others 200,000 chat messages. The pitch is “describe the app, we’ll build it” — the fine print is that somebody still has to check who can read the database afterwards. How much control do you really have once your data is inside someone else’s pipeline?
          - paragraph [ref=e73]:
            - text: Not much, if any — which is exactly why I’ve always hesitated to upload any sort of private information such as credit card bills or personal images, even for something harmless like a trend. Like ChatGPT’s viral
            - link "Ghibli effect" [ref=e74] [cursor=pointer]:
              - /url: https://www.reuters.com/technology/artificial-intelligence/ghibli-effect-chatgpt-usage-hits-record-after-rollout-viral-feature-2025-04-01/
            - text: — everyone was doing it, and I sat it out. The
            - link "’80s photo trend" [ref=e75] [cursor=pointer]:
              - /url: https://economictimes.indiatimes.com/news/new-updates/piyush-goyal-joins-viral-chatgpt-80s-photo-trend-with-a-retro-ai-generated-picture-vibing-to-the-80s-trend/articleshow/133973486.cms?from=mdr
            - text: that was fashionable in India until recently, same story. I’m not pasting credit card bills or personal photos into a stranger’s server just to get a cute avatar out of it. So for a while I just… waited for the version of this that didn’t demand so much.
          - heading "The machine I was waiting for" [level=2] [ref=e76]
          - paragraph [ref=e77]:
            - text: What I was waiting for was a machine that I owned 100% myself, one that could let me use some of this “artificial” intelligence without having to give up my privacy or my family’s data. Fortunately, NVIDIA launched the
            - link "DGX Spark" [ref=e78] [cursor=pointer]:
              - /url: https://www.nvidia.com/en-us/products/workstations/dgx-spark/
            - text: — a compact computer for local AI, with 128 GB of unified memory per box, shared between the processor and the graphics processor.
          - paragraph [ref=e79]: "If you are curious about these devices, check out these videos:"
